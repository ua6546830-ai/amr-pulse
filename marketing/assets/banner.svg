<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AMR PULSE — genotype–phenotype discordance research platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E5EAF0" stroke-width="1"/>
    </pattern>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F9D8A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1130" cy="40" r="220" fill="#0891B2" opacity="0.05"/>
  <circle cx="40" cy="620" r="180" fill="#0F9D8A" opacity="0.05"/>

  <!-- logo -->
  <rect x="64" y="46" width="36" height="36" rx="9" fill="#172033"/>
  <polyline points="72,64 79,64 83,55 89,73 94,60 100,64 104,64" fill="none" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="71" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.6" fill="#172033">AMR PULSE</text>
  <text x="1136" y="70" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="#64748B">RESEARCH INFRASTRUCTURE</text>

  <!-- badge -->
  <rect x="64" y="112" width="262" height="30" rx="15" fill="#E6F4F1"/>
  <circle cx="80" cy="127" r="3" fill="#0F9D8A"/>
  <text x="92" y="131.5" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4" fill="#0F766E">GENOTYPE–PHENOTYPE INTELLIGENCE</text>

  <!-- headline -->
  <text x="62" y="212" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#172033">Genotype–phenotype</text>
  <text x="62" y="274" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#172033">discordance,</text>
  <text x="62" y="336" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.6" fill="url(#pulse)">investigated properly.</text>

  <text x="64" y="386" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Measure agreement between curated resistance determinants</text>
  <text x="64" y="411" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">and submitted AST results — then separate real candidate</text>
  <text x="64" y="436" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">discordance from mapping, metadata and QC artefacts.</text>

  <!-- chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="64" y="472" width="160" height="32" rx="8" fill="#FFFFFF" stroke="#E5EAF0"/>
    <circle cx="80" cy="488" r="3" fill="#2563EB"/>
    <text x="91" y="492.5" fill="#334155">Deterministic engine</text>

    <rect x="234" y="472" width="174" height="32" rx="8" fill="#FFFFFF" stroke="#E5EAF0"/>
    <circle cx="250" cy="488" r="3" fill="#0891B2"/>
    <text x="261" y="492.5" fill="#334155">Five-class comparison</text>

    <rect x="418" y="472" width="132" height="32" rx="8" fill="#FFFFFF" stroke="#E5EAF0"/>
    <circle cx="434" cy="488" r="3" fill="#0F9D8A"/>
    <text x="445" y="492.5" fill="#334155">Wilson 95% CIs</text>
  </g>

  <!-- right card -->
  <g filter="url(#card)">
    <rect x="658" y="86" width="478" height="464" rx="20" fill="#FFFFFF" stroke="#E5EAF0"/>
  </g>
  <text x="686" y="120" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#64748B">MATCHED ISOLATE · PRIMARY PAIRING</text>
  <text x="686" y="146" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#172033">SYN-0042</text>
  <rect x="1066" y="126" width="44" height="24" rx="12" fill="#F1F5F9"/>
  <text x="1088" y="142" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#475569">E. coli</text>
  <line x1="686" y1="162" x2="1108" y2="162" stroke="#E5EAF0"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5">
    <text x="686" y="188" fill="#64748B">Antibiotic</text>
    <text x="1108" y="188" text-anchor="end" font-weight="600" fill="#172033">ceftriaxone</text>
    <text x="686" y="218" fill="#64748B">AST category</text>
    <rect x="1034" y="203" width="74" height="22" rx="6" fill="#FEE2E2"/>
    <text x="1071" y="218" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B91C1C">Resistant</text>
    <text x="686" y="248" fill="#64748B">Detected determinant</text>
    <text x="1108" y="248" text-anchor="end" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#172033">blaCTX-M-15</text>
    <text x="686" y="278" fill="#64748B">Evidence status</text>
    <text x="1108" y="278" text-anchor="end" font-weight="600" fill="#0F766E">established · verified</text>
  </g>

  <rect x="686" y="298" width="422" height="42" rx="9" fill="#E6F4F1" stroke="#B7E4DA"/>
  <circle cx="704" cy="319" r="5" fill="#0F9D8A"/>
  <text x="718" y="324" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F5F55">Concordant resistant</text>
  <text x="1108" y="324" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F766E">candidate status: concordant</text>

  <text x="686" y="372" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#64748B">FIVE-CLASS OUTCOME · SYNTHETIC DEMO</text>

  <!-- mini chart -->
  <line x1="686" y1="470" x2="1108" y2="470" stroke="#E5EAF0"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle">
    <rect x="694" y="422" width="62" height="48" rx="4" fill="#DC2626" opacity="0.85"/>
    <text x="725" y="416" font-size="10.5" font-weight="700" fill="#172033">34</text>
    <text x="725" y="486" fill="#64748B">CR</text>

    <rect x="786" y="396" width="62" height="74" rx="4" fill="#0F9D8A"/>
    <text x="817" y="390" font-size="10.5" font-weight="700" fill="#172033">70</text>
    <text x="817" y="486" fill="#64748B">CS</text>

    <rect x="878" y="464" width="62" height="6" rx="3" fill="#D97706"/>
    <text x="909" y="458" font-size="10.5" font-weight="700" fill="#172033">5</text>
    <text x="909" y="486" fill="#64748B">G+/S</text>

    <rect x="970" y="408" width="62" height="62" rx="4" fill="#B45309" opacity="0.9"/>
    <text x="1001" y="402" font-size="10.5" font-weight="700" fill="#172033">38</text>
    <text x="1001" y="486" fill="#64748B">R/no det</text>
  </g>
  <text x="1108" y="510" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94A3B8">147 eligible pairs · 9 indeterminate</text>
  <rect x="686" y="522" width="422" height="16" rx="4" fill="#FEF3C7"/>
  <text x="697" y="534" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#92400E">Synthetic demonstration data — not research evidence, not clinical guidance.</text>

  <!-- footer -->
  <text x="64" y="552" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748B">Import → Map → Validate → Analyse → Investigate → Report → Reproduce</text>
  <text x="64" y="586" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94A3B8">Research-support software · not a diagnostic device · not clinically validated · no regulatory certification claimed</text>
</svg>
